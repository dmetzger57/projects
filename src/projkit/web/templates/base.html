<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Projects{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Projects</a>
    <nav>
      <a href="/today" class="{{ 'on' if nav == 'today' }}">Today</a>
      <a href="/" class="{{ 'on' if nav == 'projects' }}">Overview</a>
      <a href="/ideas" class="{{ 'on' if nav == 'ideas' }}">Ideas</a>
      <a href="/archive" class="{{ 'on' if nav == 'archive' }}">Archive</a>
      <a href="/lint" class="{{ 'on' if nav == 'lint' }}">Health{% if issue_count %} <span class="badge">{{ issue_count }}</span>{% endif %}</a>
    </nav>
    <a class="btn primary" href="/new">New<span class="long">&nbsp;project</span></a>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div hx-get="/api/fingerprint" hx-trigger="every 4s" hx-swap="none" id="fp"></div>
  <script>
    // errors from the server (OpError → 400) show as a toast
    document.body.addEventListener("htmx:responseError", e => {
      const t = document.getElementById("toast");
      t.textContent = e.detail.xhr.responseText || "Something went wrong";
      t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 5000);
    });
    // live refresh when files change on disk (CLI, Finder, iCloud) — skipped while you are typing
    let fp = null;
    document.body.addEventListener("htmx:afterRequest", e => {
      if (e.detail.elt.id !== "fp" || !e.detail.successful) return;
      const v = e.detail.xhr.responseText;
      const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)
                     && document.activeElement.value;
      if (fp && v !== fp && !typing && !document.querySelector("form.editing")) location.reload();
      if (!typing) fp = v;
    });
    // ---- task reordering: drag the ⋮⋮ handle, or focus it and press ↑/↓ ----
    let dragFrom = null, focusAfter = null;
    function moveTask(list, from, to) {
      const n = list.querySelectorAll("li[data-task]").length;
      if (to < 1 || to > n || to === from) return;
      focusAfter = to;
      htmx.ajax("POST", `${list.dataset.moveUrl}/${from}/move`,
                {values: {to}, target: "#tasks", swap: "outerHTML"});
    }
    document.addEventListener("dragstart", e => {
      const h = e.target.closest?.("[data-task-handle]");
      if (!h) return;
      dragFrom = +h.dataset.taskHandle;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(dragFrom));
      h.closest("li").classList.add("dragging");
    });
    document.addEventListener("dragover", e => {
      const li = e.target.closest?.("#tasks li[data-task]");
      if (!li || dragFrom === null) return;
      e.preventDefault();
      document.querySelectorAll("#tasks li.drop-above, #tasks li.drop-below")
        .forEach(x => x.classList.remove("drop-above", "drop-below"));
      const r = li.getBoundingClientRect();
      li.classList.add(e.clientY < r.top + r.height / 2 ? "drop-above" : "drop-below");
    });
    document.addEventListener("drop", e => {
      const li = e.target.closest?.("#tasks li[data-task]");
      if (!li || dragFrom === null) return;
      e.preventDefault();
      const over = +li.dataset.task, above = li.classList.contains("drop-above");
      let to = above ? over : over + 1;          // position in the list before removal
      if (to > dragFrom) to -= 1;                // ...adjusted for removing the dragged task
      moveTask(li.closest("ul"), dragFrom, to);
    });
    document.addEventListener("dragend", () => {
      dragFrom = null;
      document.querySelectorAll("#tasks li").forEach(x => x.classList.remove("dragging", "drop-above", "drop-below"));
    });
    document.addEventListener("keydown", e => {
      const h = e.target.closest?.("[data-task-handle]");
      if (!h || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
      e.preventDefault();
      const from = +h.dataset.taskHandle;
      moveTask(h.closest("ul"), from, e.key === "ArrowUp" ? from - 1 : from + 1);
    });
    document.body.addEventListener("htmx:afterSwap", () => {
      if (focusAfter === null) return;
      document.querySelector(`[data-task-handle="${focusAfter}"]`)?.focus();
      focusAfter = null;
    });
    // ---- overview tiles: drag ⋮⋮ onto another tile of the same area, or focus it and use the arrow keys ----
    let tileFrom = null;
    function moveTile(name, other, after) {
      try { sessionStorage.setItem("focusTile", name); } catch {}
      htmx.ajax("POST", `/p/${encodeURIComponent(name)}/order`,
                {values: after ? {after: other} : {before: other}, swap: "none"});
    }
    document.addEventListener("dragstart", e => {
      const h = e.target.closest?.("[data-tile-handle]");
      if (!h) return;
      const card = h.closest(".card");
      tileFrom = card;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", card.dataset.tile);
      e.dataTransfer.setDragImage(card, 12, 12);
      card.classList.add("dragging");
    });
    document.addEventListener("dragover", e => {
      const card = e.target.closest?.(".card[data-tile]");
      if (!tileFrom || !card || card === tileFrom || card.parentElement !== tileFrom.parentElement) return;
      e.preventDefault();
      document.querySelectorAll(".card.drop-before, .card.drop-after")
        .forEach(x => x.classList.remove("drop-before", "drop-after"));
      const r = card.getBoundingClientRect();
      card.classList.add(e.clientX < r.left + r.width / 2 ? "drop-before" : "drop-after");
    });
    document.addEventListener("drop", e => {
      const card = e.target.closest?.(".card[data-tile]");
      if (!tileFrom || !card || card === tileFrom || card.parentElement !== tileFrom.parentElement) return;
      e.preventDefault();
      moveTile(tileFrom.dataset.tile, card.dataset.tile, card.classList.contains("drop-after"));
    });
    document.addEventListener("dragend", () => {
      tileFrom = null;
      document.querySelectorAll(".card").forEach(x => x.classList.remove("dragging", "drop-before", "drop-after"));
    });
    document.addEventListener("keydown", e => {
      const h = e.target.closest?.("[data-tile-handle]");
      if (!h || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
      e.preventDefault();
      const card = h.closest(".card"), earlier = e.key === "ArrowUp" || e.key === "ArrowLeft";
      const other = earlier ? card.previousElementSibling : card.nextElementSibling;
      if (other?.dataset.tile) moveTile(card.dataset.tile, other.dataset.tile, !earlier);
    });
    // ---- overview areas: drag an area's ⋮⋮ above/below another area, or focus it and use ↑/↓ ----
    let areaFrom = null;
    function moveArea(name, other, after) {
      try { sessionStorage.setItem("focusArea", name); } catch {}
      htmx.ajax("POST", "/area/move", {values: after ? {area: name, after: other} : {area: name, before: other}, swap: "none"});
    }
    document.addEventListener("dragstart", e => {
      const h = e.target.closest?.("[data-area-handle]");
      if (!h) return;
      areaFrom = h.closest("section.area");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", areaFrom.dataset.area);
      e.dataTransfer.setDragImage(areaFrom.querySelector(".area-head"), 12, 12);
      areaFrom.classList.add("dragging");
    });
    document.addEventListener("dragover", e => {
      const sec = e.target.closest?.("section.area[data-area]");
      if (!areaFrom || !sec || sec === areaFrom) return;
      e.preventDefault();
      document.querySelectorAll("section.area.drop-above, section.area.drop-below")
        .forEach(x => x.classList.remove("drop-above", "drop-below"));
      const r = sec.getBoundingClientRect();
      sec.classList.add(e.clientY < r.top + r.height / 2 ? "drop-above" : "drop-below");
    });
    document.addEventListener("drop", e => {
      const sec = e.target.closest?.("section.area[data-area]");
      if (!areaFrom || !sec || sec === areaFrom) return;
      e.preventDefault();
      moveArea(areaFrom.dataset.area, sec.dataset.area, sec.classList.contains("drop-below"));
    });
    document.addEventListener("dragend", () => {
      areaFrom = null;
      document.querySelectorAll("section.area").forEach(x => x.classList.remove("dragging", "drop-above", "drop-below"));
    });
    document.addEventListener("keydown", e => {
      const h = e.target.closest?.("[data-area-handle]");
      if (!h || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
      e.preventDefault();
      const sec = h.closest("section.area"), up = e.key === "ArrowUp";
      let other = up ? sec.previousElementSibling : sec.nextElementSibling;
      while (other && !other.matches("section.area")) other = up ? other.previousElementSibling : other.nextElementSibling;
      if (other) moveArea(sec.dataset.area, other.dataset.area, !up);
    });
    try {
      const a = sessionStorage.getItem("focusArea");
      if (a) {
        sessionStorage.removeItem("focusArea");
        [...document.querySelectorAll("section.area[data-area]")].find(s => s.dataset.area === a)
          ?.querySelector("[data-area-handle]")?.focus();
      }
    } catch {}
    try {
      const name = sessionStorage.getItem("focusTile");
      if (name) {
        sessionStorage.removeItem("focusTile");
        [...document.querySelectorAll(".card[data-tile]")].find(c => c.dataset.tile === name)
          ?.querySelector("[data-tile-handle]")?.focus();
      }
    } catch {}
    // ---- Project Files: browse ~/Documents, pick a path, show/hide actual paths ----
    function loadBrowser(box, path) {
      htmx.ajax("GET", "/browse?path=" + encodeURIComponent(path), {target: box, swap: "innerHTML"});
    }
    document.addEventListener("click", e => {
      const browseBtn = e.target.closest?.("[data-browse]");
      if (browseBtn) {
        const box = browseBtn.closest("form").querySelector(".browser");
        box.hidden = !box.hidden;
        if (!box.hidden) {
          const cur = browseBtn.closest("form").elements.target.value.trim();
          const dir = cur.startsWith("Documents/") ? cur.split("/").slice(0, -1).join("/") || "Documents" : "Documents";
          loadBrowser(box, dir);
        }
        return;
      }
      const to = e.target.closest?.("[data-browse-to]");
      if (to) { loadBrowser(to.closest(".browser"), to.dataset.browseTo); return; }
      const pick = e.target.closest?.("[data-pick-path]");
      if (pick) {
        const form = pick.closest("form"), path = pick.dataset.pickPath;
        form.elements.target.value = path;
        const next = form.elements.name || form.elements.amount;
        if (form.elements.name && !form.elements.name.value.trim()) {
          const base = path.split("/").pop();
          form.elements.name.value = base.includes(".") ? base.slice(0, base.lastIndexOf(".")) || base : base;
        }
        pick.closest(".browser").hidden = true;
        next?.focus();
      }
    });
    function applyShowPaths() {
      let on = false;
      try { on = localStorage.getItem("showPaths") === "1"; } catch {}
      document.querySelectorAll("#files").forEach(f => f.classList.toggle("show-paths", on));
      document.querySelectorAll("[data-show-paths]").forEach(c => c.checked = on);
    }
    document.addEventListener("change", e => {
      if (!e.target.matches?.("[data-show-paths]")) return;
      try { localStorage.setItem("showPaths", e.target.checked ? "1" : "0"); } catch {}
      applyShowPaths();
    });
    document.body.addEventListener("htmx:afterSwap", applyShowPaths);
    applyShowPaths();
    // our own edits change the fingerprint too; resync after each successful mutation
    document.body.addEventListener("htmx:afterOnLoad", e => {
      if (e.detail.elt.id !== "fp" && e.detail.requestConfig.verb !== "get") fp = null;
    });
  </script>
</body>
</html>
