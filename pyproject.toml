[project]
name = "projkit"
version = "0.2.0"
description = "CLI + web UI for the ~/Documents/Projects folder model"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18", "typer>=0.12", "rich>=13", "python-docx>=1.1", "pypdf>=5", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "markdown-it-py>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
proj = "projkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
