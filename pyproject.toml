[project]
name = "projkit"
version = "0.1.0"
description = "CLI + web UI for the ~/Documents/Projects folder model"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18", "typer>=0.12", "rich>=13", "python-docx>=1.1", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proj = "projkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
